[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mideagent-business-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["video-service-shared", "mideagent-tool-hub"]
[tool.setuptools.packages.find]
where = ["."]
include = ["mideagent_agents*"]
