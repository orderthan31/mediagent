[project]
name = "mideagent-cpu-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["video-service-shared"]

[project.optional-dependencies]
objects = ["video-service-shared[objects]"]
amqp = ["video-service-shared[objects,amqp]"]

[project.scripts]
mideagent-analyze = "mideagent_cpu.cli:analyze"
mideagent-extract-audio = "mideagent_cpu.cli:extract_audio"
mideagent-generate-subtitle = "mideagent_cpu.cli:generate_subtitle"
mideagent-encode = "mideagent_cpu.cli:encode"
mideagent-validate-video = "mideagent_cpu.cli:validate_video"
mideagent-object-agent = "video_service.object_agent:main"
mideagent-cpu-instance = "mideagent_cpu.server:main"
mideagent-cpu-amqp = "mideagent_cpu.broker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mideagent_cpu*"]
