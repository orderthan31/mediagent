# Explicit independently scalable CPU roles; infra/compose.yaml owns the broker.
# Each role mounts only its own private bootstrap compartment.
x-amqp: &amqp
  build:
    context: ../..
    dockerfile: agents/cpu/Dockerfile
    target: amqp
    additional_contexts:
      media_base: service:media-base
  image: mideagent-cpu-amqp:local
  init: true
  restart: "no"
  read_only: true
  stop_grace_period: 120s
  tmpfs:
    - /tmp:size=512m,uid=10001,gid=10001,mode=0700
  networks: [agent-transport]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  cpus: 1
  mem_limit: 1g
services:
  media-base:
    profiles: [build, analyze, extract-audio, generate-subtitle, encode, validate-video]
    image: mideagent-media-base:local
    build:
      context: ../..
      target: media-base
    network_mode: none
    # Build dependency only; never a long-running shared media service.
    entrypoint: [/bin/true]
    restart: "no"
  analyze:
    <<: *amqp
    profiles: [analyze]
    command: [--enable-broker, --agent, analyze, --broker-config-file, /run/bootstrap/analyze-broker.json, --object-config-file, /run/bootstrap/objects.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/agent/analyze
        target: /run/bootstrap
        read_only: true
  extract-audio:
    <<: *amqp
    profiles: [extract-audio]
    command: [--enable-broker, --agent, extract_audio, --broker-config-file, /run/bootstrap/extract_audio-broker.json, --object-config-file, /run/bootstrap/objects.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/agent/extract_audio
        target: /run/bootstrap
        read_only: true
  generate-subtitle:
    <<: *amqp
    profiles: [generate-subtitle]
    command: [--enable-broker, --agent, generate_subtitle, --broker-config-file, /run/bootstrap/generate_subtitle-broker.json, --object-config-file, /run/bootstrap/objects.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/agent/generate_subtitle
        target: /run/bootstrap
        read_only: true
  encode:
    <<: *amqp
    profiles: [encode]
    command: [--enable-broker, --agent, encode, --broker-config-file, /run/bootstrap/encode-broker.json, --object-config-file, /run/bootstrap/objects.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/agent/encode
        target: /run/bootstrap
        read_only: true
  validate-video:
    <<: *amqp
    profiles: [validate-video]
    command: [--enable-broker, --agent, validate_video, --broker-config-file, /run/bootstrap/validate_video-broker.json, --object-config-file, /run/bootstrap/objects.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/agent/validate_video
        target: /run/bootstrap
        read_only: true
networks:
  agent-transport:
    external: true
    name: ${MIDEAGENT_AGENT_NETWORK:?Set an existing isolated transport network}
