# Explicit renewal API/web recipe. No legacy workflow, provider env or auto worker.
# Create private bootstrap/DSN files first; migrations are a separate manual step.
services:
  media-base:
    profiles: [build, renewal]
    image: mideagent-media-base:local
    build:
      context: .
      target: media-base
    network_mode: none
    entrypoint: [/bin/true]
    restart: "no"
  api:
    profiles: [renewal]
    build:
      context: .
      target: runtime
    init: true
    user: "10001:10001"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs: ["/tmp:size=256m,mode=1777"]
    command: [python, -m, app.server, --bootstrap-file, /run/bootstrap/api.json]
    volumes:
      - type: bind
        source: ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/api
        target: /run/bootstrap
        read_only: true
      - content:/data/content
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; from urllib.parse import urlsplit; c=json.load(open('/run/bootstrap/api.json')); r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':urlsplit(c['allowed_origins'][0]).netloc}); urllib.request.urlopen(r,timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    profiles: [renewal]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: "no"
    ports: ["127.0.0.1:8080:80"]
    logging: *logs
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  content:
