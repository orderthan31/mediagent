name: Renewal CPU contracts and build recipes
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: renewal_tests
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      CUSTOM_TIKTOKEN_CACHE_DIR: /tmp/mideagent-tokenizers
      MIDEAGENT_TEST_DISPOSABLE: "1"
      MIDEAGENT_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=renewal_tests
      MIDEAGENT_BOOTSTRAP_DIR: /tmp/synthetic-bootstrap-unused
      MIDEAGENT_AGENT_CONTENT_ROOT: /tmp/synthetic-content-unused
      MIDEAGENT_AGENT_ENV_FILE: /dev/null
      MIDEAGENT_AGENT_NETWORK: synthetic-transport-unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - run: python -m pip install -e 'packages/shared[postgres,models,objects,amqp,verify]' -e agents -e apps/orchestrator -e packages/tool-hub -e tools/models -e runtime/controlnet -e apps/api -e tools/media -e tools/gpu
      - run: python -m mideagent_model_tools.sdk_cache "$CUSTOM_TIKTOKEN_CACHE_DIR"
      - name: Validate recipes only; no broker, GPU or provider stack is started
        run: |
          docker compose --profile renewal config --quiet
          docker compose -f tools/media/compose.yaml --profile '*' config --quiet
          docker compose -f tools/media/compose.amqp.yaml --profile '*' config --quiet
          docker buildx bake --print api cpu cpu-amqp api-broker gpu
      - run: python tests/renewal/check_layer_packaging.py
      - run: python -m pytest tests/renewal -q --tb=short
