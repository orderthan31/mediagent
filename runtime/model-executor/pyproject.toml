[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mideagent-model-roles"
version="0.1.0"
requires-python=">=3.12"
dependencies=["video-service-shared", "mideagent-business-agents", "mideagent-model-tools"]
[project.scripts]
mideagent-model-runtime="mideagent_model_runtime.broker:main"
[tool.setuptools.packages.find]
where=["src"]
