[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mideagent-model-tools"
version="0.1.0"
requires-python=">=3.12"
dependencies=["video-service-shared", "httpx>=0.28.1,<1"]

[project.scripts]
mideagent-model-tool="mideagent_model_tools.bridge:main"

[tool.setuptools.packages.find]
where=["."]
include=["mideagent_model_tools*"]
