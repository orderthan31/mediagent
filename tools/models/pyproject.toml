[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="mideagent-model-tools"
version="0.1.0"
requires-python=">=3.12"
dependencies=["video-service-shared", "httpx==0.28.1"]

[project.optional-dependencies]
sdk=["litellm==1.106.6", "openai==2.54.0", "tiktoken==0.14.0", "boto3==1.43.117", "botocore==1.43.117", "google-auth==2.62.2", "pyasn1-modules==0.4.2", "pyasn1==0.6.5"]

[project.scripts]
mideagent-model-tool="mideagent_model_tools.bridge:main"

[tool.setuptools.packages.find]
where=["."]
include=["mideagent_model_tools*"]
