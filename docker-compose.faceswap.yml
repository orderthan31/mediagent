# Optional overlay: all queued work remains in the same worker and execution lock.
# Existing HyperSwap models are compatible with 3.9.0; mount read-only.
services:
  api:
    environment:
      FACEFUSION_CHUNK_SECONDS: ${FACEFUSION_CHUNK_SECONDS:-600}
  worker:
    build:
      args:
        WITH_FACEFUSION: "1"
    environment:
      FACEFUSION_ENABLED: "true"
      FACEFUSION_PATH: /opt/facefusion
      FACEFUSION_PYTHON: /opt/facefusion-env/bin/python
      FACEFUSION_TIMEOUT_SECONDS: "86400"
      FACEFUSION_CHUNK_SECONDS: ${FACEFUSION_CHUNK_SECONDS:-600}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - type: bind
        source: ${FACEFUSION_MODELS_DIR:?Set FACEFUSION_MODELS_DIR to the installed .assets/models directory}
        target: /opt/facefusion/.assets/models
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
