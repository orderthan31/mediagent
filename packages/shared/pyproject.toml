[project]
name = "video-service-shared"
version = "0.1.0"
description = "Shared domain models and utilities for the video subtitle monorepo."
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "srt==3.5.3", "cryptography>=45.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
models = ["httpx>=0.28.1,<1"]
objects = ["boto3>=1.36,<2"]

[tool.setuptools.package-data]
video_service = ["postgres/migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["."]
include = ["video_service*"]
