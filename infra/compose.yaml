# Explicit optional infrastructure. Never started by the default Compose invocation.
# Generate NEW private files outside the checkout; never replace existing data/keys.
x-hardening: &hardening
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
services:
  postgres:
    <<: *hardening
    profiles: [infrastructure]
    user: "70:10001"
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: mideagent
      POSTGRES_DB: mideagent
      POSTGRES_PASSWORD_FILE: /run/bootstrap/password
    volumes:
      - ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/postgres:/run/bootstrap:ro
      - postgres-data:/var/lib/postgresql/data
    networks: [agent-transport]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mideagent -d mideagent"]
      interval: 10s
      timeout: 5s
      retries: 10
  broker:
    <<: *hardening
    profiles: [infrastructure]
    image: rabbitmq:4.2.9-management-alpine@sha256:5606bedb254b7b5bcf890ad8d9237abb59f9bc0ee98d9e9b9f0c113f4f489b6c
    user: "100:10001"
    hostname: mideagent-broker
    environment:
      RABBITMQ_CONFIG_FILE: /run/bootstrap/rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +A 4"
    volumes:
      - ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/broker:/run/bootstrap:ro
      - broker-data:/var/lib/rabbitmq
    networks: [agent-transport]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 8s
      retries: 12
  objects:
    <<: *hardening
    profiles: [infrastructure]
    image: mideagent-objects:9e49d5e
    pull_policy: never
    build:
      context: ..
      dockerfile: infra/objects.Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:size=64m,uid=10001,gid=10001,mode=0700]
    volumes:
      - ${MIDEAGENT_BOOTSTRAP_DIR:?Set an absolute private bootstrap directory}/objects:/run/bootstrap:ro
      - objects-data:/data
    networks: [agent-transport]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/bootstrap/ca.crt, https://127.0.0.1:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  agent-transport:
    name: ${MIDEAGENT_AGENT_NETWORK:?Set an explicitly isolated network name}
    internal: true
volumes:
  postgres-data:
  broker-data:
  objects-data:
